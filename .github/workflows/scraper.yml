name: Universal Tender Scraper

on:
  schedule:
    # Runs every 6 hours automatically
    - cron: '0 */6 * * *'
  # Also allows manual trigger anytime from GitHub Actions tab
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      # No browser needed: CPPP and GeM publish their tender lists as plain HTML.
      # The step fails (red run) if no source returned tenders or inserts failed,
      # so an outage is visible instead of looking like a quiet "0 new" success.
      - name: Run Scraper
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NODE_ENV: production
        run: npm run scrape
